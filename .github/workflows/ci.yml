name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Install, build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Test (full suite)
        run: pnpm exec vitest run

      - name: Packaging dry-run
        run: |
          set -euo pipefail
          for pkg in crypto-core poe-standard sdk-ts; do
            ( cd "packages/$pkg" && npm pack --dry-run )
          done
