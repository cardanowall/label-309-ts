name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Install, build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Test (full suite)
        run: pnpm exec vitest run

      # Lints the artefact each package would publish, not the working tree:
      # publint catches an `exports` target the `files` allowlist leaves out of
      # the tarball (conditions are matched on key presence, not file existence,
      # so such a target simply fails to resolve for consumers), and attw checks
      # that both module systems get declarations they can use. The node10
      # profile is skipped deliberately: subpath exports cannot satisfy legacy
      # `main`/`types` resolution without a typesVersions shim.
      - name: Packaging lint (publint + attw)
        run: |
          set -euo pipefail
          for pkg in crypto-core poe-standard sdk-ts; do
            pnpm exec publint run "packages/$pkg" --strict
            pnpm exec attw --pack "packages/$pkg" --profile node16 --summary
          done
